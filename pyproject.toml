[project]
name = "lazypr-grupo-06"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "agno>=2.6.5",
    "groq>=1.2.0",
    "plotly>=6.7.0",
    "pydantic>=2.13",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
]

[tool.black]
line-length = 88

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
